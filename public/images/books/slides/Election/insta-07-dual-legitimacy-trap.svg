<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" dir="rtl">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;500;700;900&amp;display=swap');
    * { font-family: 'Vazirmatn', sans-serif; }
  </style>
  <linearGradient id="ibg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#0a0e27"/>
    <stop offset="55%" style="stop-color:#0d1333"/>
    <stop offset="100%" style="stop-color:#160b24"/>
  </linearGradient>
  <linearGradient id="goldTxt" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f7dd9c"/>
    <stop offset="100%" stop-color="#c89a2e"/>
  </linearGradient>
  <filter id="ish"><feDropShadow dx="0" dy="3" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1080" height="1080" fill="url(#ibg)"/>
<rect x="4" y="4" width="1072" height="1072" rx="46" fill="none" stroke="#0a0e27" stroke-width="10" opacity="0.55" filter="url(#glow)"/>
<rect x="62" y="78" width="956" height="924" rx="34" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.09)" stroke-width="1.5" filter="url(#ish)"/>
<rect x="115" y="118" width="185.5" height="46" rx="23" fill="#e74c3c"/>
<text x="207.75" y="148" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">درسِ بزرگ</text>
<text x="540.0" y="340.0" fill="url(#goldTxt)" font-size="50" font-weight="900" text-anchor="middle">حتی اگر</text>
<text x="540.0" y="399.0" fill="url(#goldTxt)" font-size="50" font-weight="900" text-anchor="middle">«درست» رأی دهید...</text>
<line x1="370.0" y1="470" x2="710.0" y2="470" stroke="#d4af37" stroke-width="3" opacity="0.75"/>
<text x="540.0" y="530.0" fill="#ffffff" font-size="24" font-weight="400" text-anchor="middle">رهبری، شورای نگهبان، صداوسیما،</text>
<text x="540.0" y="562.4" fill="#ffffff" font-size="24" font-weight="400" text-anchor="middle">و سپاه—هرگز به رأیِ شما وابسته نیستند</text>
<rect x="160" y="650" width="760" height="170" rx="16" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.09)" stroke-width="1.3"/>
<text x="540.0" y="728.2" fill="#e74c3c" font-size="34" font-weight="900" text-anchor="middle">۴ نهادِ کلیدی</text>
<text x="540.0" y="775.8" fill="rgba(255,255,255,0.65)" font-size="15" font-weight="400" text-anchor="middle">غیرمنتخب اما تعیین‌کننده در سیاستِ کلان</text>
<text x="540.0" y="920.0" fill="rgba(255,255,255,0.85)" font-size="22" font-weight="400" text-anchor="middle">ساختارِ «مشروعیتِ دوگانه»:</text>
<text x="540.0" y="951.9" text-anchor="middle" font-size="22"><tspan fill="#d4af37" font-weight="700">دو ستونِ موازیِ قدرت</tspan></text>
<text x="985" y="1002" fill="rgba(255,255,255,0.32)" font-size="22" font-weight="700" text-anchor="end">۷ / ۱۲</text>
</svg>