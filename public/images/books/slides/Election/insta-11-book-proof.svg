<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" dir="rtl">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;500;700;900&amp;display=swap');
    * { font-family: 'Vazirmatn', sans-serif; }
  </style>
  <linearGradient id="ibg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#0a0e27"/>
    <stop offset="55%" style="stop-color:#0d1333"/>
    <stop offset="100%" style="stop-color:#160b24"/>
  </linearGradient>
  <linearGradient id="goldTxt" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f7dd9c"/>
    <stop offset="100%" stop-color="#c89a2e"/>
  </linearGradient>
  <filter id="ish"><feDropShadow dx="0" dy="3" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1080" height="1080" fill="url(#ibg)"/>
<rect x="4" y="4" width="1072" height="1072" rx="46" fill="none" stroke="#0a0e27" stroke-width="10" opacity="0.55" filter="url(#glow)"/>
<rect x="62" y="78" width="956" height="924" rx="34" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.09)" stroke-width="1.5" filter="url(#ish)"/>
<rect x="115" y="118" width="201.0" height="46" rx="23" fill="#d4af37"/>
<text x="215.5" y="148" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">درونِ کتاب</text>
<text x="540.0" y="260.0" fill="#d4af37" font-size="52" font-weight="900" text-anchor="middle">حقیقت در ۸ فصل</text>
<text x="540.0" y="340.0" fill="#ffffff" font-size="22" font-weight="400" text-anchor="middle">مدل‌ها، داده‌ها، و تحلیل‌های عمیق</text>
<text x="540.0" y="369.7" fill="#ffffff" font-size="22" font-weight="400" text-anchor="middle">برایِ فهمِ نهادِ انتخابات در ایران</text>
<rect x="150" y="460" width="350" height="190" rx="16" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.09)" stroke-width="1.3"/>
<text x="325.0" y="547.4" fill="#d4af37" font-size="46" font-weight="900" text-anchor="middle">۵۱+</text>
<text x="325.0" y="600.6" fill="rgba(255,255,255,0.65)" font-size="15" font-weight="400" text-anchor="middle">نمودار و جدولِ مستند</text>
<rect x="580" y="460" width="350" height="190" rx="16" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.09)" stroke-width="1.3"/>
<text x="755.0" y="547.4" fill="#00b4d8" font-size="46" font-weight="900" text-anchor="middle">۴۶</text>
<text x="755.0" y="600.6" fill="rgba(255,255,255,0.65)" font-size="15" font-weight="400" text-anchor="middle">سالِ تاریخِ بررسی‌شده</text>
<rect x="150" y="680" width="350" height="190" rx="16" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.09)" stroke-width="1.3"/>
<text x="325.0" y="767.4" fill="#2ecc71" font-size="46" font-weight="900" text-anchor="middle">۷</text>
<text x="325.0" y="820.6" fill="rgba(255,255,255,0.65)" font-size="15" font-weight="400" text-anchor="middle">دوره‌ی تاریخیِ متمایز</text>
<rect x="580" y="680" width="350" height="190" rx="16" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.09)" stroke-width="1.3"/>
<text x="755.0" y="767.4" fill="#e74c3c" font-size="46" font-weight="900" text-anchor="middle">۱</text>
<text x="755.0" y="820.6" fill="rgba(255,255,255,0.65)" font-size="15" font-weight="400" text-anchor="middle">مدلِ اختصاصیِ ارزیابی</text>
<text x="540.0" y="940.0" fill="rgba(255,255,255,0.85)" font-size="19" font-weight="400" text-anchor="middle">به همراهِ واژه‌نامه، نمایه، و</text>
<text x="540.0" y="967.55" text-anchor="middle" font-size="19"><tspan fill="#d4af37" font-weight="700">کتاب‌شناسیِ تحلیلی</tspan></text>
<text x="985" y="1002" fill="rgba(255,255,255,0.32)" font-size="22" font-weight="700" text-anchor="end">۱۱ / ۱۲</text>
</svg>