<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" dir="rtl">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;500;700;900&amp;display=swap');
    * { font-family: 'Vazirmatn', sans-serif; }
  </style>
  <linearGradient id="ibg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#0a0e27"/>
    <stop offset="55%" style="stop-color:#0d1333"/>
    <stop offset="100%" style="stop-color:#160b24"/>
  </linearGradient>
  <linearGradient id="goldTxt" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f7dd9c"/>
    <stop offset="100%" stop-color="#c89a2e"/>
  </linearGradient>
  <filter id="ish"><feDropShadow dx="0" dy="3" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1080" height="1080" fill="url(#ibg)"/>
<rect x="4" y="4" width="1072" height="1072" rx="46" fill="none" stroke="#d4af37" stroke-width="10" opacity="0.55" filter="url(#glow)"/>
<rect x="62" y="78" width="956" height="924" rx="34" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.09)" stroke-width="1.5" filter="url(#ish)"/>
<rect x="115" y="118" width="185.5" height="46" rx="23" fill="#2ecc71"/>
<text x="207.75" y="148" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">همین حالا</text>
<text x="540.0" y="380.0" fill="url(#goldTxt)" font-size="64" font-weight="900" text-anchor="middle">کتاب را</text>
<text x="540.0" y="455.52" fill="url(#goldTxt)" font-size="64" font-weight="900" text-anchor="middle">کامل بخوانید</text>
<line x1="370.0" y1="520" x2="710.0" y2="520" stroke="#d4af37" stroke-width="3" opacity="0.75"/>
<text x="540.0" y="590.0" fill="#ffffff" font-size="25" font-weight="400" text-anchor="middle">نهادِ انتخابات در جمهوریِ اسلامیِ ایران</text>
<text x="540.0" y="623.75" fill="#ffffff" font-size="25" font-weight="400" text-anchor="middle">یک تحلیلِ نهادی، تاریخی، و تطبیقیِ کامل</text>
<rect x="330.0" y="760" width="420" height="90" rx="45.0" fill="#d4af37"/>
<text x="540.0" y="817.0" fill="#0a0e27" font-size="26" font-weight="800" text-anchor="middle">برای دریافتِ کتاب پیام دهید</text>
<text x="540.0" y="900" fill="rgba(255,255,255,0.7)" font-size="22" font-weight="400" text-anchor="middle">نویسنده: مهدی سالم</text>
<text x="985" y="1002" fill="rgba(255,255,255,0.32)" font-size="22" font-weight="700" text-anchor="end">۱۲ / ۱۲</text>
</svg>