<text x="540.0" y="460.0" fill="#ffffff" font-size="24" font-weight="400" text-anchor="middle">مشارکتِ ۸۰٪ در «دوم خرداد» به ۴۹٪</text>
<text x="540.0" y="492.4" fill="#ffffff" font-size="24" font-weight="400" text-anchor="middle">در انتخاباتِ ۱۴۰۰ رسید</text>
<circle cx="160.0" cy="620.0" r="12" fill="#2ecc71"/>
<text x="160.0" y="596.0" fill="#2ecc71" font-size="22" font-weight="900" text-anchor="middle">۸۰٪</text>
<text x="160.0" y="820" fill="rgba(255,255,255,0.6)" font-size="18" font-weight="400" text-anchor="middle">۱۳۷۶</text>
<line x1="160.0" y1="620.0" x2="413.3" y2="610.0" stroke="#d4af37" stroke-width="4"/>
<circle cx="413.3" cy="610.0" r="12" fill="#2ecc71"/>
