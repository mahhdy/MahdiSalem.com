<text x="413.33333333333337" y="820" fill="rgba(255,255,255,0.6)" font-size="18" font-weight="400" text-anchor="middle">۱۳۸۸</text>
<line x1="413.3" y1="610.0" x2="666.7" y2="682.0" stroke="#d4af37" stroke-width="4"/>
<circle cx="666.7" cy="682.0" r="12" fill="#e74c3c"/>
<text x="666.6666666666667" y="658.0" fill="#e74c3c" font-size="22" font-weight="900" text-anchor="middle">۴۹٪</text>
<text x="666.6666666666667" y="820" fill="rgba(255,255,255,0.6)" font-size="18" font-weight="400" text-anchor="middle">۱۴۰۰</text>
<line x1="666.7" y1="682.0" x2="920.0" y2="690.0" stroke="#d4af37" stroke-width="4"/>
<circle cx="920.0" cy="690.0" r="12" fill="#e74c3c"/>
