<text x="920.0" y="820" fill="rgba(255,255,255,0.6)" font-size="18" font-weight="400" text-anchor="middle">۱۴۰۳</text>
<text x="540.0" y="940.0" fill="rgba(255,255,255,0.85)" font-size="22" font-weight="400" text-anchor="middle">مردمِ ایران خیلی زود از</text>
<text x="540.0" y="971.9" text-anchor="middle" font-size="22"><tspan fill="#d4af37" font-weight="700">«ناکامی‌ها»</tspan><tspan fill="rgba(255,255,255,0.85)"> بیزار شدند</tspan></text>
<text x="985" y="1002" fill="rgba(255,255,255,0.32)" font-size="22" font-weight="700" text-anchor="end">۶ / ۱۲</text>
</svg>