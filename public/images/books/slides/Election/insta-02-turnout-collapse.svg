<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" dir="rtl">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;500;700;900&amp;display=swap');
    * { font-family: 'Vazirmatn', sans-serif; }
  </style>
  <linearGradient id="ibg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#0a0e27"/>
    <stop offset="55%" style="stop-color:#0d1333"/>
    <stop offset="100%" style="stop-color:#160b24"/>
  </linearGradient>
  <linearGradient id="goldTxt" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f7dd9c"/>
    <stop offset="100%" stop-color="#c89a2e"/>
  </linearGradient>
  <filter id="ish"><feDropShadow dx="0" dy="3" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1080" height="1080" fill="url(#ibg)"/>
<rect x="4" y="4" width="1072" height="1072" rx="46" fill="none" stroke="#0a0e27" stroke-width="10" opacity="0.55" filter="url(#glow)"/>
<rect x="62" y="78" width="956" height="924" rx="34" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.09)" stroke-width="1.5" filter="url(#ish)"/>
<rect x="115" y="118" width="232.0" height="46" rx="23" fill="#e74c3c"/>
<text x="231.0" y="148" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">شکستِ مشارکت</text>
<text x="540.0" y="210" fill="rgba(255,255,255,0.7)" font-size="22" font-weight="400" text-anchor="middle">از</text>
<text x="540.0" y="300.0" fill="#d4af37" font-size="78" font-weight="900" text-anchor="middle">۸۰٪  →  ۴۰٪</text>
<text x="540.0" y="430.0" fill="#ffffff" font-size="24" font-weight="400" text-anchor="middle">روندِ مشارکتِ رسمی در انتخاباتِ</text>
<text x="540.0" y="462.4" fill="#ffffff" font-size="24" font-weight="400" text-anchor="middle">ریاست‌جمهوری از ۱۳۷۶ تا ۱۴۰۳</text>
<rect x="215.1" y="612.0" width="79.8" height="208.0" rx="6" fill="#2ecc71"/>
<text x="255.0" y="600.0" fill="#2ecc71" font-size="22" font-weight="900" text-anchor="middle">۸۰</text>
<text x="255.0" y="850" fill="rgba(255,255,255,0.6)" font-size="15" font-weight="400" text-anchor="middle">۱۳۷۶</text>
<rect x="405.1" y="599.0" width="79.8" height="221.0" rx="6" fill="#2ecc71"/>
<text x="445.0" y="587.0" fill="#2ecc71" font-size="22" font-weight="900" text-anchor="middle">۸۵</text>
<text x="445.0" y="850" fill="rgba(255,255,255,0.6)" font-size="15" font-weight="400" text-anchor="middle">۱۳۸۸</text>
<rect x="595.1" y="692.6" width="79.8" height="127.4" rx="6" fill="#e74c3c"/>
<text x="635.0" y="680.6" fill="#e74c3c" font-size="22" font-weight="900" text-anchor="middle">۴۹</text>
<text x="635.0" y="850" fill="rgba(255,255,255,0.6)" font-size="15" font-weight="400" text-anchor="middle">۱۴۰۰</text>
<rect x="785.1" y="703.0" width="79.8" height="117.0" rx="6" fill="#e74c3c"/>
<text x="825.0" y="691.0" fill="#e74c3c" font-size="22" font-weight="900" text-anchor="middle">۴۵</text>
<text x="825.0" y="850" fill="rgba(255,255,255,0.6)" font-size="15" font-weight="400" text-anchor="middle">۱۴۰۳</text>
<text x="540.0" y="910.0" fill="rgba(255,255,255,0.85)" font-size="22" font-weight="400" text-anchor="middle">در ۲۸ سال، مشارکتِ رسمی</text>
<text x="540.0" y="941.9" text-anchor="middle" font-size="22"><tspan fill="#d4af37" font-weight="700">نیمی از مقدارِ اوجِ خود</tspan><tspan fill="rgba(255,255,255,0.85)"> را از دست داد</tspan></text>
<text x="985" y="1002" fill="rgba(255,255,255,0.32)" font-size="22" font-weight="700" text-anchor="end">۲ / ۱۲</text>
</svg>